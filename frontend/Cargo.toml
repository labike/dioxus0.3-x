[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cfg-if = "1.0.4"
time = "0.3.52"
chrono = { version = "0.4.45", features = ["serde"] }
console_log = { version = "1.0.0", optional = true, features = ["color"] }
dioxus = { version = "0.7.9", default-features = false, features = ["macro", "hooks", "html", "signals", "router", "launch", "web"]}
dioxus-router = { version = "0.7.9" }
dioxus-web = "0.7.9"
futures = "0.3"
gloo-file = { version = "0.4.0", features = ["futures"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-utils = "0.3.0"
indexmap = "2.14.0"
itertools = "0.15.0"
js-sys = "0.3.102"
load-dotenv = "0.1.2"
log = "0.4"
once_cell = "1.18.0"
reqwest = { version = "0.13.4", features = [
  "json",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
url = "2.5.8"
web-sys = { version = "0.3.103", features = [
  "Blob",
  "Document",
  "File",
  "FileList",
  "History",
  "HtmlDocument",
  "HtmlInputElement",
  "Location",
  "Window",
] }
wasm-bindgen = "0.2.126"

# needed to build docs (bug in interprocess crate transitive dependency)
interprocess = { version = "2.4.2", features = ["tokio"], optional = true }

uchat_cookie = { path = "../shared/cookie" }
uchat_domain = { path = "../shared/domain" }
uchat_endpoint = { path = "../shared/endpoint" }

[features]
default = ["console_log"]
docbuild = ["interprocess"]
