[package]
name = "uchat_domain"
version = "0.1.0"
edition = "2024"

[dependencies]
nutype = { version = "0.7.0", features = ["serde"] }
once_cell = "1"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["v4", "serde", "js"] }

diesel-derive-newtype = { version = "2.1.2", optional = true}

[dependencies.diesel]
version = "2.3.10"
features = ["postgres", "uuid", "chrono", "serde_json", "postgres_backend", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"]
default-features = false
optional = true

[features]
query = ["dep:diesel", "dep:diesel-derive-newtype"]

