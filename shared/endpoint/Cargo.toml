[package]
name = "uchat_endpoint"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
load-dotenv = "0.1.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde", "js"] }

uchat_domain = { path = "../domain" }