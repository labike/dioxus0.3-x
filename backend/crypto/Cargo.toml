[package]
name = "uchat_crypto"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
password-hash = { version = "0.6.1" }
rand = "0.10.1"
rand_core = { version = "0.10.1" }
rmp-serde = "1.3.1"
rsa = { version = "0.9.10", features = ["sha2", "serde"] }
thiserror = "2.0.18"
tracing = { version = "0.1.44", features = ["attributes"] }
